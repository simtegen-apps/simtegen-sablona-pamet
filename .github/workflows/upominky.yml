# Upomínky před koncem zkušebního období — e-mail zákazníkovi, kterému končí
# zkušební doba a ještě nezaplatil: 2–3 dny před koncem, den před koncem
# a po konci (co dál funguje a jak pokračovat). Každá nejvýš jednou na účet.
# A obnova: zákazníkovi, který platí fakturou, týden před koncem
# předplaceného období (jednou za období; Google Play se obnovuje samo).
# A odpověď: zákazníkovi, jehož hlášení firma vyřídila nebo odložila, odpověď
# e-mailem (jednou za odpověď, jen odpovědi z posledních 3 dnů).
# Logika a zdůvodnění: .github/nastroje/upominky.py.
#
# Proč tady: Pages Functions nemají plánovač, workflow soubory v produktech
# se nikdy neaktualizují (token bota na ně nesmí) a repo šablony dostane
# každý merge samo — stejně jako Metriky. Běží jen v repu šablony
# (simtegen-sablona-pamet), pro každý produkt s databází `<repo>-db`;
# v produktových repech je soubor zděděný a běh (i ruční) se přeskočí.
# Ručně: Run workflow (`projekt` = jeden produkt, `nanecisto` = jen spočítat).
#
# Bez RESEND_API_KEY / EMAIL_ODESILATEL (org secret / variable) se nic
# neposílá ani nezapisuje a běh skončí zeleně. Logy jsou veřejné, proto
# v nich jsou jen počty, nikdy adresa. SimteGen na workflow soubory nesahá.

name: Upominky

on:
  schedule:
    - cron: "23 7 * * *"   # denně 07:23 UTC = 8:23 / 9:23 v Česku
  workflow_dispatch:
    inputs:
      projekt:
        description: "Název repa produktu (prázdné = všechny produkty s databází na Cloudflare)"
        required: false
        default: ""
      nanecisto:
        description: "Jen spočítat, komu by co odešlo — nic neposílat ani nezapisovat"
        type: boolean
        required: false
        default: false

# Two runs at once would race for the same claims; the primary key keeps
# them from sending twice, but one queue is simpler to read in the log.
concurrency:
  group: upominky
  cancel-in-progress: false

env:
  # One exact wrangler for every call (a SimteGen test keeps it equal
  # everywhere); bump by hand to a release at least two weeks old.
  WRANGLER: wrangler@3.114.17

jobs:
  posli:
    # Only from main. The workflow file is the same on every branch (the
    # bot token may not touch workflows), the scripts it runs are not: a
    # branch pushed with a stolen token could carry its own .github/nastroje
    # (over_pokyn.py included) next to these secrets. And only in the
    # template repo: products inherit a copy of this file, and that copy
    # must never run with the org secrets.
    if: github.ref == 'refs/heads/main' && github.repository == 'simtegen-apps/simtegen-sablona-pamet'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      # One exact wrangler from the committed lockfile (integrity hashes), no
      # install scripts, nothing looked up in the registry at run time. The
      # files are checked against hashes in this workflow file, which the bot
      # token cannot write (py ops/otisky_vydani.py rewrites them).
      - name: Wrangler
        run: |
          set -euo pipefail
          sha256sum --check --strict <<'OTISKY'
          4fcbcc058abacae2ac38480d798fdfecb8690e33274211055a3a8cff302a261f  .github/nastroje/wrangler.package.json
          1d85c79d1b64c522d125c07ab8d6eea85f7e3eac60e8c308f4154a3725016b5d  .github/nastroje/wrangler.lock.json
          OTISKY
          w="$RUNNER_TEMP/wrangler"
          mkdir -p "$w"
          cp .github/nastroje/wrangler.package.json "$w/package.json"
          cp .github/nastroje/wrangler.lock.json "$w/package-lock.json"
          (cd "$w" && npm ci --ignore-scripts --no-audit --no-fund --silent)
          [ "$(jq -r .version "$w/node_modules/wrangler/package.json")" = "${WRANGLER##*@}" ] || {
            echo "Zamceny wrangler neni verze z WRANGLER."; exit 1; }
          echo "$w/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Posli upominky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ODESILATEL: ${{ vars.EMAIL_ODESILATEL }}
          PROJEKT_VSTUP: ${{ inputs.projekt }}
          PRODUKTY: ${{ vars.SIMTEGEN_PRODUKTY }}
          REPO_NAME: ${{ github.event.repository.name }}
          VLASTNIK: ${{ github.repository_owner }}
          NANECISTO: ${{ inputs.nanecisto }}
        run: python3 .github/nastroje/upominky.py
