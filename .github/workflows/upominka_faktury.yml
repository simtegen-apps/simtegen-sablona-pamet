# Upomínka faktury po splatnosti. Spouští ji SimteGen (firma) pár dní po
# splatnosti nezaplacené faktury a jednou později znovu; majitel se o faktuře
# dozví až po nich. E-mail zákazníka je v databázi produktu a klíč Resend
# v organizaci — proto tady, stejně jako Faktura. Jen text, bez PDF.
#
# Když objednávka mezitím není `fakturovana` (zaplacená, zrušená), nic se
# neposílá. run-name nese číslo faktury a pořadí upomínky.

name: Upominka faktury
run-name: "Upominka ${{ inputs.cislo }}/${{ inputs.poradi }} (${{ inputs.projekt }})"

on:
  workflow_dispatch:
    inputs:
      projekt:
        description: "Název repa produktu"
        required: true
      objednavka:
        description: "Id objednávky v databázi produktu"
        required: true
      cislo:
        description: "Číslo faktury"
        required: true
      castka_czk:
        description: "Částka v Kč (celé číslo)"
        required: true
      splatnost:
        description: "Původní splatnost YYYY-MM-DD"
        required: true
      poradi:
        description: "Kolikátá upomínka (1, 2…)"
        required: true
      dodavatel:
        description: "JSON: nazev, email, ucet"
        required: true
      podpis:
        description: "Podpis SimteGenu (vyplňuje firma; ruční běh správce ho nepotřebuje)"
        required: false
        default: ""

# Least privilege: the job only checks out this repository.
permissions:
  contents: read

concurrency:
  group: upominka-${{ inputs.projekt }}-${{ inputs.cislo }}
  cancel-in-progress: false

jobs:
  posli:
    # Only from main. The workflow file is the same on every branch (the
    # bot token may not touch workflows), the scripts it runs are not: a
    # branch pushed with a stolen token could carry its own .github/nastroje
    # (over_pokyn.py included) next to these secrets.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # A stolen bot token must not be enough to mail customers: SimteGen's
      # signature or a listed human (.github/nastroje/over_pokyn.py).
      - name: Over pokyn (podpis SimteGenu nebo spravce)
        env:
          PODPIS_KLIC: ${{ vars.SIMTEGEN_PODPIS }}
          SPRAVCI: ${{ vars.SIMTEGEN_SPRAVCI }}
          AKTER: ${{ github.triggering_actor }}
          WORKFLOW: ${{ github.workflow }}
          VSTUPY: ${{ toJSON(inputs) }}
        run: python3 .github/nastroje/over_pokyn.py

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Posli upominku
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_ODESILATEL: ${{ vars.EMAIL_ODESILATEL }}
          PROJEKT: ${{ inputs.projekt }}
          OBJEDNAVKA: ${{ inputs.objednavka }}
          CISLO: ${{ inputs.cislo }}
          CASTKA_CZK: ${{ inputs.castka_czk }}
          SPLATNOST: ${{ inputs.splatnost }}
          PORADI: ${{ inputs.poradi }}
          DODAVATEL: ${{ inputs.dodavatel }}
        run: python3 .github/nastroje/upominka_faktury.py
