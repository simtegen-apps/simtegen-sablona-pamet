# Metriky produktů pro měsíční revizi — čísla, žádné osobní údaje.
#
# SimteGen do databází produktů nevidí (org secrets žijí jen v Actions), tak
# čísla spočítá tenhle workflow a odloží je do větve `metriky` REPA ŠABLONY
# (soubor produkty/<repo>.json). Odtud je SimteGen čte jedním čtením
# obsahu. Větev main šablony to nemění (chrání ji ruleset), Sablony
# workflow ji nepřepisuje (force-push jde jen na main).
#
# Repo šablony je veřejné, a tím i větev `metriky` a logy běhu. Počty účtů,
# platících a plateb jsou obchodní čísla firmy, takže každý soubor odchází
# ZAŠIFROVANÝ veřejným klíčem schránky SimteGenu (org variable
# SIMTEGEN_KLIC_SCHRANKY — stejné RSA-OAEP jako hlášení, schranka_sifra.js)
# a do logu se nevypisuje žádné číslo. Bez klíče se nezveřejní nic.
#
# Běží PLÁNOVANĚ jen v repu šablony (simtegen-sablona-pamet), a to pro
# každý produkt, který má na Cloudflare databázi `<repo>-db` — seznam si
# zjistí sám z `wrangler d1 list`, nic se neudržuje ručně. Org variable
# SIMTEGEN_PRODUKTY (názvy rep oddělené čárkou) je jen volitelný přepis.
# V produktových repech je soubor zděděný ze šablony a plánovaný běh se
# v nich přeskočí. Ručně: Run workflow s `projekt`.
#
# Co se počítá (vše COUNT/SUM nad D1, nikdy řádky):
#   účty celkem / nové 30 d, aktivní 7 d a 30 d (relace), zkušební,
#   předplatné aktivní / vypršelé, platby 30 d, platící účty, účty s druhou
#   platbou, hlášení 30 d, a pro každou tabulku produktu se sloupcem
#   uzivatel_id počet řádků (+ nové za 30 d, má-li sloupec vytvoreno) — bez
#   ukázkových dat, která si zákazník nahrál do prázdného účtu.
#   Účty „Vyzkoušet ukázku“ (@ukazka.invalid) nejsou zákazníci a nepočítají
#   se nikde. Předplatné = řádek v predplatne U ÚČTU, KTERÝ ASPOŇ JEDNOU
#   ZAPLATIL (platby): řádek mají i prodloužená zkušební doba, tarif převedený
#   při zavedení předplatného a ukázkové účty, a ty nejsou platící.
#   Konverze (migrace 0920): zkušební období skončená za 30 d a celkem,
#   z nich zaplacená, zaplacená po upomínce, odeslané upomínky za 30 d podle
#   druhu, účty s ukázkovými daty. null = produkt migraci ještě nemá.
#   Podle zdroje příchodu (migrace 0910, utm_source): návštěvy 30 d, účty,
#   nové účty 30 d, platící a druhá platba — nejvýš 20 zdrojů.

name: Metriky

on:
  schedule:
    - cron: "17 4 * * 1"   # pondělí 04:17 UTC
  workflow_dispatch:
    inputs:
      projekt:
        description: "Název repa produktu (prázdné = všechny produkty s databází na Cloudflare)"
        required: false
        default: ""

env:
  # One exact wrangler for every call (a SimteGen test keeps it equal
  # everywhere); bump by hand to a release at least two weeks old.
  WRANGLER: wrangler@3.114.17

jobs:
  spocitej:
    # Only from main. The workflow file is the same on every branch (the
    # bot token may not touch workflows), the scripts it runs are not: a
    # branch pushed with a stolen token could carry its own .github/nastroje
    # (over_pokyn.py included) next to these secrets.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.repository.name == 'simtegen-sablona-pamet')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Spocitej metriky
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJEKT_VSTUP: ${{ inputs.projekt }}
          PRODUKTY: ${{ vars.SIMTEGEN_PRODUKTY }}
          REPO_NAME: ${{ github.event.repository.name }}
          KLIC_SCHRANKY: ${{ vars.SIMTEGEN_KLIC_SCHRANKY }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Org secrets CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID nejsou dostupne."
            exit 1
          fi
          if [ -z "${KLIC_SCHRANKY:-}" ]; then
            echo "Chybi org variable SIMTEGEN_KLIC_SCHRANKY (verejny klic schranky SimteGenu) - metriky nezverejnuji."
            exit 1
          fi
          # The report cipher (schranka_sifra.js) for a whole file: RSA-OAEP
          # with SHA-256, cut into the chunks a 3072-bit key carries. Kept
          # next to the counts so the next step can reuse it.
          cat > sifruj.mjs <<'JS'
          import { readFileSync } from "node:fs";
          const jwk = JSON.parse(process.env.KLIC_SCHRANKY);
          if (jwk.d !== undefined) throw new Error("SIMTEGEN_KLIC_SCHRANKY musi byt verejny klic, ne soukromy.");
          const klic = await crypto.subtle.importKey("jwk", jwk, { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]);
          const data = new TextEncoder().encode(JSON.stringify(JSON.parse(readFileSync(0, "utf-8"))));
          const radky = [];
          for (let i = 0; i < data.length; i += 318) {
            const blok = new Uint8Array(await crypto.subtle.encrypt({ name: "RSA-OAEP" }, klic, data.slice(i, i + 318)));
            radky.push(Buffer.from(blok).toString("base64"));
          }
          process.stdout.write("Metriky produktu. Sifrovane - cist je umi jen SimteGen.\n\n" +
            "-----SIMTEGEN SIFRA v1-----\n" + radky.join("\n") + "\n-----KONEC SIFRY-----\n");
          JS
          if [ -n "$PROJEKT_VSTUP" ]; then
            seznam="$PROJEKT_VSTUP"
          elif [ "$REPO_NAME" != "simtegen-sablona-pamet" ]; then
            seznam="$REPO_NAME"
          elif [ -n "${PRODUKTY:-}" ]; then
            seznam="$PRODUKTY"
          else
            # Every product born from the template has a D1 database named
            # <repo>-db (deploy.yml creates it). The preview databases end
            # with -db-nahled and are skipped. No list to maintain.
            seznam=$(npx --yes "$WRANGLER" d1 list --json               | jq -r '[.[] | .name | select(endswith("-db")) | sub("-db$"; "")] | join(",")')
          fi
          if [ -z "$seznam" ]; then
            echo "Zadny produkt: na Cloudflare neni zadna databaze <repo>-db."
            exit 1
          fi
          mkdir -p vystup
          q() {  # q <db> <sql> -> první hodnota prvního řádku (nebo 0)
            npx --yes "$WRANGLER" d1 execute "$1" --remote --json --command "$2" \
              | jq -r '.[0].results[0] | to_entries[0].value // 0'
          }
          DEN=$(date -u +%F)
          T30=$(( $(date -u +%s) - 30*86400 ))
          T7=$(( $(date -u +%s) - 7*86400 ))
          IFS=',' read -ra repa <<< "$seznam"
          for repo in "${repa[@]}"; do
            repo=$(printf '%s' "$repo" | tr -d '[:space:]')
            [ -n "$repo" ] || continue
            DB="$repo-db"
            echo "== $repo"
            ucty=$(q "$DB" "SELECT COUNT(*) FROM uzivatele WHERE email NOT LIKE '%@ukazka.invalid'")
            ucty_nove=$(q "$DB" "SELECT COUNT(*) FROM uzivatele WHERE vytvoreno > $T30 AND email NOT LIKE '%@ukazka.invalid'")
            # Active = a session created in the window, OR one still alive: the
            # middleware renews a session on use (30 days from the renewal), so
            # a regular who never logs in again has no new row — counting new
            # rows only missed exactly the customers who stay (audit D3).
            aktivni30=$(q "$DB" "SELECT COUNT(DISTINCT r.uzivatel_id) FROM relace r JOIN uzivatele u ON u.id = r.uzivatel_id WHERE (r.vytvoreno > $T30 OR r.expirace > unixepoch()) AND u.email NOT LIKE '%@ukazka.invalid'")
            aktivni7=$(q "$DB" "SELECT COUNT(DISTINCT r.uzivatel_id) FROM relace r JOIN uzivatele u ON u.id = r.uzivatel_id WHERE (r.vytvoreno > $T7 OR r.expirace > unixepoch() + 23 * 86400) AND u.email NOT LIKE '%@ukazka.invalid'")
            ma_predplatne=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='predplatne'")
            ma_platby=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='platby'")
            if [ "$ma_predplatne" = "1" ] && [ "$ma_platby" = "1" ]; then
              pred_aktivni=$(q "$DB" "SELECT COUNT(*) FROM predplatne p WHERE p.plati_do > unixepoch() AND EXISTS (SELECT 1 FROM platby x WHERE x.uzivatel_id = p.uzivatel_id)")
              pred_vyprsele=$(q "$DB" "SELECT COUNT(*) FROM predplatne p WHERE p.plati_do <= unixepoch() AND EXISTS (SELECT 1 FROM platby x WHERE x.uzivatel_id = p.uzivatel_id)")
              # Churn: paid periods that ended in the last 30 days and were
              # not renewed (the end date would have moved on).
              odchod30=$(q "$DB" "SELECT COUNT(*) FROM predplatne p WHERE p.plati_do > $T30 AND p.plati_do <= unixepoch() AND EXISTS (SELECT 1 FROM platby x WHERE x.uzivatel_id = p.uzivatel_id)")
              zkusebni=$(q "$DB" "SELECT COUNT(*) FROM uzivatele u WHERE u.vytvoreno > $T30 AND u.email NOT LIKE '%@ukazka.invalid' AND NOT EXISTS (SELECT 1 FROM platby x WHERE x.uzivatel_id = u.id)")
            else
              pred_aktivni=0; pred_vyprsele=0; zkusebni=0; odchod30=0
            fi
            if [ "$ma_platby" = "1" ]; then
              platby30=$(q "$DB" "SELECT COUNT(*) FROM platby WHERE zapsano > $T30")
              platici=$(q "$DB" "SELECT COUNT(DISTINCT uzivatel_id) FROM platby")
              druha=$(q "$DB" "SELECT COUNT(*) FROM (SELECT uzivatel_id FROM platby GROUP BY uzivatel_id HAVING COUNT(*) >= 2)")
            else
              platby30=0; platici=0; druha=0
            fi
            ma_navstevy=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='navstevy'")
            if [ "$ma_navstevy" = "1" ]; then
              zobrazeni30=$(q "$DB" "SELECT COALESCE(SUM(pocet), 0) FROM navstevy WHERE stranka = 'uvod' AND den >= date('now', '-30 days')")
            else
              zobrazeni30=0
            fi
            zdroje='{}'
            ma_zdroje=$(q "$DB" "SELECT COUNT(*) FROM pragma_table_info('uzivatele') WHERE name='zdroj'")
            if [ "$ma_zdroje" = "1" ]; then
              if [ "$ma_platby" = "1" ]; then
                platici_sql="(SELECT COUNT(*) FROM uzivatele u WHERE u.zdroj = z.zdroj AND EXISTS (SELECT 1 FROM platby p WHERE p.uzivatel_id = u.id))"
                druha_sql="(SELECT COUNT(*) FROM uzivatele u WHERE u.zdroj = z.zdroj AND (SELECT COUNT(*) FROM platby p WHERE p.uzivatel_id = u.id) >= 2)"
              else
                platici_sql=0; druha_sql=0
              fi
              zdroje=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
                "SELECT z.zdroj AS zdroj, (SELECT COALESCE(SUM(n.pocet), 0) FROM zdroje_navstev n WHERE n.zdroj = z.zdroj AND n.den >= date('now', '-30 days')) AS navstevy_30d, (SELECT COUNT(*) FROM uzivatele u WHERE u.zdroj = z.zdroj) AS ucty, (SELECT COUNT(*) FROM uzivatele u WHERE u.zdroj = z.zdroj AND u.vytvoreno > $T30) AS ucty_30d, $platici_sql AS platici, $druha_sql AS druha_platba FROM (SELECT zdroj FROM uzivatele WHERE zdroj IS NOT NULL UNION SELECT zdroj FROM zdroje_navstev) z ORDER BY ucty DESC, navstevy_30d DESC LIMIT 20" \
                | jq '[.[0].results[] | {key: .zdroj, value: del(.zdroj)}] | from_entries')
            fi
            # Trial → paid (migration 0920): only accounts the app has seen in
            # their trial since the migration (zkusebni_doba), demo accounts
            # out. zaplatilo = at least one row in platby (invoice or Play),
            # whenever it came; po_upomince = paid after a trial reminder.
            konverze='null'
            ma_konverzi=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('zkusebni_doba','upominky','ukazkova_data')")
            if [ "$ma_konverzi" = "3" ]; then
              if [ "$ma_platby" = "1" ]; then
                zaplaceno_sql="EXISTS (SELECT 1 FROM platby p WHERE p.uzivatel_id = z.uzivatel_id)"
                po_upomince_sql="(SELECT COUNT(DISTINCT u.uzivatel_id) FROM upominky u WHERE u.druh IN ('pred_3','pred_1','konec') AND EXISTS (SELECT 1 FROM platby p WHERE p.uzivatel_id = u.uzivatel_id AND p.zapsano >= u.odeslano))"
              else
                zaplaceno_sql="0"; po_upomince_sql="0"
              fi
              zk="FROM zkusebni_doba z JOIN uzivatele u ON u.id = z.uzivatel_id WHERE u.email NOT LIKE '%@ukazka.invalid'"
              konverze=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
                "SELECT (SELECT COUNT(*) $zk) AS zkusebni_sledovano, (SELECT COUNT(*) $zk AND z.konec <= unixepoch() AND z.konec > $T30) AS skoncilo_30d, (SELECT COUNT(*) $zk AND z.konec <= unixepoch() AND z.konec > $T30 AND $zaplaceno_sql) AS zaplatilo_30d, (SELECT COUNT(*) $zk AND z.konec <= unixepoch()) AS skoncilo_celkem, (SELECT COUNT(*) $zk AND z.konec <= unixepoch() AND $zaplaceno_sql) AS zaplatilo_celkem, $po_upomince_sql AS zaplatilo_po_upomince, (SELECT COUNT(*) FROM upominky WHERE druh = 'pred_3' AND odeslano > $T30) AS upominky_pred_3_30d, (SELECT COUNT(*) FROM upominky WHERE druh = 'pred_1' AND odeslano > $T30) AS upominky_pred_1_30d, (SELECT COUNT(*) FROM upominky WHERE druh = 'konec' AND odeslano > $T30) AS upominky_konec_30d, (SELECT COUNT(*) FROM ukazkova_data) AS ucty_s_ukazkovymi_daty" \
                | jq '.[0].results[0]')
            fi
            ma_hlaseni=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='hlaseni'")
            if [ "$ma_hlaseni" = "1" ]; then
              hlaseni30=$(q "$DB" "SELECT COUNT(*) FROM hlaseni WHERE vytvoreno > $T30")
            else
              hlaseni30=0
            fi
            # Product tables: anything with uzivatel_id that the template did not ship.
            # The template's subscription orders are told by their SCHEMA, not
            # their name: Pneusklad's own "objednavky" are tyre orders — its
            # use — while its subscription orders live in
            # "objednavky_predplatneho". By name, the first was dropped and the
            # second counted as use.
            tabulky=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
              "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf%' AND name NOT IN ('d1_migrations','uzivatele','prihlasovaci_odkazy','relace','predplatne','platby','hlaseni','navstevy','zdroje_navstev','zkusebni_doba','upominky','ukazkova_data','chyby_stranek','play_nakupy')" \
              | jq -r '.[0].results[].name')
            pouziti='{}'
            zaznam_or=""
            for t in $tabulky; do
              ma_uid=$(q "$DB" "SELECT COUNT(*) FROM pragma_table_info('$t') WHERE name='uzivatel_id'")
              [ "$ma_uid" = "1" ] || continue
              # A subscription order (consent to start before the withdrawal
              # window, § 1837 l) is buying, not using.
              objednavka_predplatneho=$(q "$DB" "SELECT COUNT(*) FROM pragma_table_info('$t') WHERE name='souhlas_zahajeni'")
              [ "$objednavka_predplatneho" = "0" ] || continue
              # Sample data (ukazkova_data: per account, the rowid range of
              # the sample rows) is not use: without this, "loaded the demo
              # and left" would read as an active customer. Falls back to the
              # plain count if the table has no rowid.
              bez_ukazky=""
              if [ "$ma_konverzi" = "3" ] && [[ "$t" =~ ^[a-z_][a-z0-9_]*$ ]]; then
                bez_ukazky="WHERE NOT EXISTS (SELECT 1 FROM ukazkova_data k WHERE k.uzivatel_id = \"$t\".uzivatel_id AND \"$t\".rowid > COALESCE(json_extract(k.pred, '\$.$t'), 0) AND \"$t\".rowid <= COALESCE(json_extract(COALESCE(k.po, k.pred), '\$.$t'), 0))"
              fi
              celkem=$(q "$DB" "SELECT COUNT(*) FROM \"$t\" $bez_ukazky" || q "$DB" "SELECT COUNT(*) FROM \"$t\"")
              ma_vytv=$(q "$DB" "SELECT COUNT(*) FROM pragma_table_info('$t') WHERE name='vytvoreno'")
              if [ "$ma_vytv" = "1" ]; then
                if [ -n "$bez_ukazky" ]; then
                  nove=$(q "$DB" "SELECT COUNT(*) FROM \"$t\" $bez_ukazky AND vytvoreno > $T30" || q "$DB" "SELECT COUNT(*) FROM \"$t\" WHERE vytvoreno > $T30")
                else
                  nove=$(q "$DB" "SELECT COUNT(*) FROM \"$t\" WHERE vytvoreno > $T30")
                fi
              else
                nove=null
              fi
              pouziti=$(printf '%s' "$pouziti" | jq --arg t "$t" --argjson c "$celkem" --argjson n "$nove" '. + {($t): {celkem: $c, nove_30d: $n}}')
              # The newcomer's own record in this table (sample rows out) —
              # one leg of "first record" below.
              zaznam_or="${zaznam_or:+$zaznam_or OR }EXISTS (SELECT 1 FROM \"$t\" ${bez_ukazky:-WHERE 1} AND \"$t\".uzivatel_id = u.id)"
            done
            # Where newcomers drop off (D9/P9): accounts of the last 30 days,
            # demo accounts out → with a record of their own → paid. Counts
            # only; null = the product does not have that stage.
            nove_sql="FROM uzivatele u WHERE u.vytvoreno > $T30 AND u.email NOT LIKE '%@ukazka.invalid'"
            s_zaznamem="NULL"
            [ -n "$zaznam_or" ] && s_zaznamem="(SELECT COUNT(*) $nove_sql AND ($zaznam_or))"
            zaplatili="NULL"
            [ "$ma_platby" = "1" ] && zaplatili="(SELECT COUNT(*) $nove_sql AND EXISTS (SELECT 1 FROM platby p WHERE p.uzivatel_id = u.id))"
            nahrali="NULL"
            [ "$ma_konverzi" = "3" ] && nahrali="(SELECT COUNT(*) FROM ukazkova_data k WHERE k.nahrano > $T30)"
            cesta=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
              "SELECT (SELECT COUNT(*) FROM uzivatele u WHERE u.vytvoreno > $T30 AND u.email LIKE '%@ukazka.invalid') AS ukazka_ucty_30d, $nahrali AS ukazkova_data_30d, (SELECT COUNT(*) $nove_sql) AS nove_30d, $s_zaznamem AS s_prvnim_zaznamem_30d, $zaplatili AS zaplatili_30d" \
              | jq '.[0].results[0]')
            # Script errors customers hit (0930, P9): totals and the top
            # places — screen and our code location only, never a message.
            chyby='null'
            ma_chyby=$(q "$DB" "SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='chyby_stranek'")
            if [ "$ma_chyby" = "1" ]; then
              souhrn_chyb=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
                "SELECT (SELECT COALESCE(SUM(pocet), 0) FROM chyby_stranek WHERE den > date('now', '-7 days')) AS celkem_7d, (SELECT COALESCE(SUM(pocet), 0) FROM chyby_stranek WHERE den > date('now', '-30 days')) AS celkem_30d, (SELECT COUNT(DISTINCT den) FROM chyby_stranek WHERE den > date('now', '-7 days')) AS dni_7d" \
                | jq '.[0].results[0]')
              mista=$(npx --yes "$WRANGLER" d1 execute "$DB" --remote --json --command \
                "SELECT obrazovka, misto, SUM(pocet) AS pocet_7d, COUNT(DISTINCT den) AS dni_7d FROM chyby_stranek WHERE den > date('now', '-7 days') GROUP BY obrazovka, misto ORDER BY pocet_7d DESC LIMIT 10" \
                | jq '.[0].results')
              chyby=$(printf '%s' "$souhrn_chyb" | jq --argjson m "$mista" '. + {mista: $m}')
            fi
            jq -n --arg repo "$repo" --arg den "$DEN" \
              --argjson ucty "$ucty" --argjson ucty_nove "$ucty_nove" \
              --argjson aktivni7 "$aktivni7" --argjson aktivni30 "$aktivni30" \
              --argjson zkusebni "$zkusebni" --argjson pa "$pred_aktivni" --argjson pv "$pred_vyprsele" \
              --argjson odchod30 "$odchod30" --argjson ma_pred "$ma_predplatne" \
              --argjson platby30 "$platby30" --argjson platici "$platici" --argjson druha "$druha" \
              --argjson hlaseni30 "$hlaseni30" --argjson pouziti "$pouziti" --argjson zobrazeni30 "$zobrazeni30" \
              --argjson zdroje "$zdroje" --argjson konverze "$konverze" \
              --argjson cesta "$cesta" --argjson chyby "$chyby" \
              '{repo: $repo, den: $den, zobrazeni_30d: $zobrazeni30, ucty_celkem: $ucty, ucty_nove_30d: $ucty_nove,
                aktivni_7d: $aktivni7, aktivni_30d: $aktivni30, zkusebni: $zkusebni,
                predplatne_aktivni: $pa, predplatne_vyprsele: $pv, odchod_30d: $odchod30,
                meri_predplatne: ($ma_pred == 1),
                platby_30d: $platby30, platici_ucty: $platici, ucty_s_druhou_platbou: $druha,
                hlaseni_30d: $hlaseni30, pouziti: $pouziti, zdroje: $zdroje, konverze: $konverze,
                cesta: $cesta, chyby_stranek: $chyby}' > "vystup/$repo.cisla"
            node sifruj.mjs < "vystup/$repo.cisla" > "vystup/$repo.json"
            rm -f "vystup/$repo.cisla"
          done

      - name: Uloz do vetve metriky
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_FULL: ${{ github.repository }}
          KLIC_SCHRANKY: ${{ vars.SIMTEGEN_KLIC_SCHRANKY }}
        run: |
          set -euo pipefail
          git config --global user.name "SimteGen metriky"
          git config --global user.email "simtegen@users.noreply.github.com"
          git clone -q --depth 1 --branch metriky "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL}.git" vetev 2>/dev/null || {
            mkdir vetev && git -C vetev init -q -b metriky
            git -C vetev remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO_FULL}.git"
          }
          mkdir -p vetev/produkty vetev/historie
          for f in vystup/*.json; do
            n=$(basename "$f" .json)
            cp "$f" "vetev/produkty/$n.json"
            mkdir -p "vetev/historie/$n"
            cp "$f" "vetev/historie/$n/$(date -u +%F).json"
          done
          # Files from before the encryption: encrypted in place, so the
          # branch's current tree carries no plain number (old commits keep
          # them until the owner recreates the branch once).
          find vetev/produkty vetev/historie -name '*.json' -type f | while read -r f; do
            grep -q -- "-----SIMTEGEN SIFRA v1-----" "$f" && continue
            if node sifruj.mjs < "$f" > "$f.sifra"; then mv "$f.sifra" "$f"; else rm -f "$f.sifra" "$f"; fi
          done
          git -C vetev add -A
          git -C vetev commit -q -m "metriky $(date -u +%F)" || { echo "beze zmeny"; exit 0; }
          git -C vetev push -q origin metriky
          echo "Metriky ulozeny do vetve metriky."
